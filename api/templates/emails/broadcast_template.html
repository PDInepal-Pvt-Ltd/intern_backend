<!DOCTYPE html>
<html>
<head>
    <style>
        .container { max-width: 600px; margin: 0 auto; font-family: 'Segoe UI', Arial, sans-serif; border: 1px solid #e0e0e0; }
        .header { background: #1a237e; color: #ffffff; padding: 25px; text-align: center; }
        .content { padding: 40px; background: #ffffff; line-height: 1.8; color: #333333; }
        .footer { padding: 20px; background: #f5f5f5; text-align: center; color: #777777; font-size: 12px; }
        .button { 
            display: inline-block; background: #4CAF50; color: white !important; 
            padding: 14px 28px; text-decoration: none; border-radius: 5px; font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 style="margin:0;">Pravidhi News & Updates</h1>
        </div>
        
        <div class="content">
            <h2 style="color: #1a237e;">{{ subject }}</h2>
            
            <!-- |linebreaks ensures that paragraphs typed by Admin show up correctly -->
            <p>{{ message_body|linebreaks }}</p>
            
            <p style="text-align: center; margin-top: 40px;">
                <a href="{{ website_url }}" class="button">View on Website</a>
            </p>
        </div>
        
        <div class="footer">
            <p>© Pravidhi. All rights reserved.</p>
            <p>You are receiving this because you're a Pravidhi subscriber. <br>
            <a href="#">Unsubscribe</a></p>
        </div>
    </div>
</body>
</html>
